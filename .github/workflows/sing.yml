name: Cançons cantades (veu DiffSinger)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['singing/**', '.github/workflows/sing.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependències
        run: pip install onnxruntime==1.20.1 onnx pyyaml numpy
      - name: Baixar la veu TIGER i els vocoders (no es redistribueixen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voice
          gh release view v102 --repo spicytigermeat/tiger_diffsinger --json assets --jq '.assets[] | "\(.name) \(.size)"'
          gh release download v102 --repo spicytigermeat/tiger_diffsinger -D voice/raw
          gh release download pc-nsf-hifigan-44.1k-hop512-128bin-2025.02 --repo openvpi/vocoders -p '*.zip' -D voice/raw
          python singing/unzip_all.py voice/raw/TIGER_DS_v102_PACK.zip voice/tiger voice/raw/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02.zip voice/vocoder
          rm -rf voice/raw
      - name: Explorar
        run: python singing/probe.py voice
