name: Cançons cantades (veu DiffSinger)

# Compon cançons amb lletra dels estils melòdics, les fa cantar amb la veu TIGER
# (DiffSinger, CC BY-NC-ND 4.0: ús no comercial; el model es baixa a cada execució
# i no es redistribueix) i les deixa com a artefacte per escoltar-les.
on:
  workflow_dispatch:
    inputs:
      count:
        description: Quantes cançons
        default: '1'
  push:
    branches: ['claude/**']
    paths: ['singing/**', '.github/workflows/sing.yml']

permissions:
  contents: read

jobs:
  sing:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependències
        run: |
          npm ci
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          pip install onnxruntime==1.17.3 onnx pyyaml numpy scipy soundfile cmudict
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Recuperar els bancs de mostres descarregats
        uses: actions/cache@v4
        with:
          path: .cache
          key: soundbanks-${{ hashFiles('soundbank-source.json', 'real-instruments.json', 'scripts/real-instruments.mjs', 'extra-instruments.json', 'scripts/extra-instruments.mjs', 'round-robin.json') }}
          restore-keys: soundbanks-
      - name: Construir la web
        run: npm run build
      - name: Baixar la veu TIGER i el vocoder (no es redistribueixen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v102 --repo spicytigermeat/tiger_diffsinger -D voice/raw
          python singing/unzip_all.py voice/raw/TIGER_DS_v102_PACK.zip voice/tiger
          rm -rf voice/raw
      - name: Comprovar que els models es carreguen
        run: |
          for m in $(find voice -name '*.onnx'); do python -c "import onnxruntime as o,sys; o.InferenceSession(sys.argv[1], providers=['CPUExecutionProvider']); print('ok', sys.argv[1])" "$m" || echo "FALLA $m"; done
      - name: Compondre les cançons i exportar la banda
        run: |
          (cd dist && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          node singing/export.cjs http://localhost:8000/ out ${{ github.event.inputs.count || '1' }}
      - name: Cantar
        run: |
          for score in out/*.json; do
            base="${score%.json}"
            python singing/sing.py voice/tiger "$score" "$base.band.wav" "$base.mp3"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: cancons-cantades
          path: |
            out/*.mp3
            out/*.vocal.wav
            out/*.json
          retention-days: 14
