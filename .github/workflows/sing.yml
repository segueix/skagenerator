name: Cançons cantades en català (Matxa i timbres)

# Generació manual de mostres preproduïdes. La ràdio canta al navegador.
# L'àudio es prepara a GitHub Actions i es publica a 'cantades' perquè els
# mòbils no hagin de sintetitzar-lo mentre escolten la ràdio.
on:
  # Els enregistraments preproduïts es conserven com a opció manual.
  # La generació automàtica de veu cantada passa al navegador.
  workflow_dispatch:
    inputs:
      count:
        description: Quantes cançons (alterna ska i punk)
        default: '2'

permissions:
  contents: write
  actions: write

concurrency:
  group: cancons-cantades
  cancel-in-progress: false

jobs:
  sing:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependències del generador
        run: |
          npm ci
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          pip install 'numpy<2' scipy soundfile pyworld pyyaml
          # Alineació de les consonants catalanes amb MMS (més intel·ligible).
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.0 torchaudio==2.4.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Comprovar els quinze filtres de timbre
        run: python -m unittest discover -s singing -p 'test_voice_timbres.py'
      - name: Recuperar els bancs de mostres
        uses: actions/cache@v4
        with:
          path: .cache
          key: soundbanks-${{ hashFiles('soundbank-source.json', 'real-instruments.json', 'scripts/real-instruments.mjs', 'extra-instruments.json', 'scripts/extra-instruments.mjs', 'round-robin.json') }}
          restore-keys: soundbanks-
      - name: Construir l'aplicació
        run: npm run build
      - name: Compondre cançons amb lletra catalana i exportar la banda
        env:
          EXPORT_STYLES: ska,punk
          EXPORT_ROTATE: daily
          EXPORT_LANG: ca
        run: |
          (cd dist && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          node singing/export.cjs http://localhost:8000/ out ${{ github.event.inputs.count || '2' }}
      - name: Cantar amb Matxa i el timbre del subgènere
        env:
          # El demo públic de Matxa no és una API amb disponibilitat garantida.
          # Si falla, no publiquem pas una cançó etiquetada com a cantada.
          MATXA_TAKES: '1'
          MATXA_CHOIR: ''
          MATXA_ALIGN: '1'
          VOCAL_DOUBLE: '1'
        run: |
          set -euo pipefail
          for score in out/*.json; do
            case "$score" in *.meta.json) continue ;; esac
            base="${score%.json}"
            python singing/sing.py none "$score" "$base.band.wav" "$base.mp3" --matxa auto --timbre auto
            test -s "$base.mp3"
          done
          ls -lh out/*.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: cancons-matxa-catala
          path: |
            out/*.mp3
            out/*.meta.json
            out/*.vocal.wav
          retention-days: 14
      - name: Publicar les cançons a la ràdio
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view cantades >/dev/null 2>&1 || gh release create cantades --title "Cançons cantades" --notes "Cançons cantades en català amb Matxa (Projecte Aina). Veu i filtres adaptats al subgènere. Ús segons les llicències dels models de veu."
          gh release edit cantades --notes "Cançons cantades en català amb Matxa (Projecte Aina). Veu i filtres segons el subgènere; consulteu les llicències dels models de veu abans d'un ús comercial."
          mkdir -p prev
          gh release download cantades -p catalog.json -D prev || true
          python singing/catalog.py prev/catalog.json out catalog.json drop.txt
          gh release upload cantades out/*.mp3 catalog.json --clobber
          while IFS= read -r file; do
            if [ -n "$file" ]; then gh release delete-asset cantades "$file" -y || true; fi
          done < drop.txt
          gh workflow run deploy-pages.yml --ref main
