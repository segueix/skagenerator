name: Publicar Ska Generator amb els instruments reals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ska-generator-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar la web i el banc d’instruments
    runs-on: ubuntu-latest
    steps:
      - name: Obtenir el codi
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instal·lar les dependències
        run: npm ci
      - name: Passar els tests
        run: npm test
      - name: Construir la web
        run: npm run build
      - name: Comprovar els recursos necessaris
        run: |
          test -s dist/index.html
          test -s dist/sample-worker.js
          test -s dist/assets/generaluser-ska-punk.sf2
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Pujar els fitxers compilats
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar la versió compilada
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # La configuració antiga de Pages encara engega un desplegament Jekyll
      # sobre main. Deixem-lo acabar abans de publicar la web compilada amb
      # el banc SF2 i el worker: així el fitxer index.html nu no sobreescriu dist/.
      - name: Evitar que Jekyll substitueixi la web compilada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 48); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment") | .status] |
                     if length == 0 then "not-found" elif all(. == "completed") then "completed" else "pending" end')
            if [ "$status" = "completed" ]; then
              echo "El desplegament Jekyll anterior ja ha acabat."
              break
            fi
            if [ "$status" = "not-found" ] && [ "$attempt" -ge 4 ]; then
              echo "No hi ha cap desplegament Jekyll paral·lel."
              break
            fi
            if [ "$attempt" -eq 48 ]; then
              echo "::error::La publicació Jekyll encara no ha finalitzat."
              exit 1
            fi
            sleep 5
          done
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
