name: Cançons en català amb la teva veu (Matxa + Seed-VC)

# Compon cançons amb lletra en català (alternant un ska i un punk), les fa cantar a Matxa
# (veu neuronal catalana del Projecte Aina, a través del seu espai públic) i les converteix al
# timbre de singing/samples/veu-referencia.wav amb Seed-VC (GPL-3.0, versió fixada). De moment
# només en deixa un artefacte per escoltar-les: no publica res.
on:
  workflow_dispatch:
    inputs:
      count:
        description: Quantes cançons (alternen ska i punk)
        default: '2'
  push:
    branches: ['claude/**']
    paths: ['singing/**', 'lyrics.js', '.github/workflows/sing-catala.yml']

permissions:
  contents: read

concurrency:
  group: cancons-catala
  cancel-in-progress: true

env:
  SEED_VC_COMMIT: 51383efd921027683c89e5348211d93ff12ac2a8

jobs:
  sing:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependències
        run: |
          npm ci
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.0 torchaudio==2.4.0
          pip install 'numpy<2' scipy soundfile pyworld librosa munch einops transformers==4.46.3 hydra-core pyyaml huggingface-hub accelerate descript-audio-codec pydub tqdm matplotlib faster-whisper
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Seed-VC (versió fixada)
        run: |
          git init -q seedvc && cd seedvc
          git fetch -q --depth 1 https://github.com/Plachtaa/seed-vc "$SEED_VC_COMMIT" && git checkout -q FETCH_HEAD
      - name: Recuperar els bancs de mostres descarregats
        uses: actions/cache@v4
        with:
          path: .cache
          key: soundbanks-${{ hashFiles('soundbank-source.json', 'real-instruments.json', 'scripts/real-instruments.mjs', 'extra-instruments.json', 'scripts/extra-instruments.mjs', 'round-robin.json') }}
          restore-keys: soundbanks-
      - name: Recuperar els models de Seed-VC
        uses: actions/cache@v4
        with:
          path: |
            seedvc/checkpoints
            ~/.cache/huggingface
            ~/.cache/torch
          key: seedvc-${{ env.SEED_VC_COMMIT }}
      - name: Construir la web
        run: npm run build
      - name: Compondre les cançons (lletra en català) i exportar la banda
        env:
          EXPORT_STYLES: ska,punk
          EXPORT_LANG: ca
        run: |
          (cd dist && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          node singing/export.cjs http://localhost:8000/ out ${{ github.event.inputs.count || '2' }}
      - name: Cantar amb Matxa i posar-hi el timbre
        env:
          MATXA_TAKES: '3'   # tres preses per vers; es queda la que un reconeixedor de veu entén millor
        run: |
          if [ ! -f singing/samples/veu-referencia.wav ]; then
            echo "::warning::Falta singing/samples/veu-referencia.wav (la mostra del teu timbre): només es fa la versió de Matxa."
          fi
          for score in out/*.json; do
            case "$score" in *.meta.json) continue ;; esac
            base="${score%.json}"; name=$(basename "$base")
            # 1. Matxa canta (veu Grau) i es desa la veu seca.
            VOCAL_DRY=1 python singing/sing.py none "$score" "$base.band.wav" "out/$name-matxa.mp3" --matxa grau
            [ -f singing/samples/veu-referencia.wav ] || continue
            # 2. Seed-VC la converteix al timbre de la referència (mantenint la melodia).
            (cd seedvc && python inference.py --source "../out/$name-matxa.dry.wav" --target ../singing/samples/veu-referencia.wav \
              --output ../out/vc --diffusion-steps 25 --f0-condition True --auto-f0-adjust False --fp16 False)
            vc=$(ls -t out/vc/vc_"$name"-matxa*.wav | head -1)
            # 3. Mescla amb la banda: amb megàfon i sense.
            python singing/sing.py none "$score" "$base.band.wav" "out/$name-la-meva-veu-megafon.mp3" --vocal "$vc" --fx megaphone
            python singing/sing.py none "$score" "$base.band.wav" "out/$name-la-meva-veu.mp3" --vocal "$vc"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: cancons-en-catala
          path: |
            out/*.mp3
            out/*.meta.json
          retention-days: 14
