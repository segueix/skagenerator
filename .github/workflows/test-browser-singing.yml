name: Provar el cant Matxa al navegador

on:
  push:
    branches: [main, 'claude/**', 'feat/**']
    paths:
      - 'browser-singing.js'
      - 'matxa-singer.js'
      - 'matxa-worker.js'
      - 'world.js'
      - 'vendor/world/**'
      - 'radio.js'
      - 'audio-utils.js'
      - 'scripts/build.mjs'
      - 'tests/browser-singing.test.cjs'
      - '.github/workflows/test-browser-singing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navegador-matxa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar els mòduls
        run: |
          node --check browser-singing.js
          node --check matxa-singer.js
          node --check matxa-worker.js
          node --check world.js
          node --check radio.js
          node --check scripts/build.mjs
      - name: Provar WORLD, el cant de Matxa, la mescla i la cancel·lació
        run: node --test tests/browser-singing.test.cjs
      - name: Recuperar els bancs d'instruments
        uses: actions/cache@v4
        with:
          path: .cache
          key: soundbanks-${{ hashFiles('soundbank-source.json', 'real-instruments.json', 'scripts/real-instruments.mjs', 'extra-instruments.json', 'scripts/extra-instruments.mjs', 'round-robin.json') }}
          restore-keys: soundbanks-
      - name: Comprovar que es publica el worker i el motor
        run: |
          npm ci
          npm run build
          test -s dist/browser-singing.js
          test -s dist/matxa-worker.js
          grep -q 'browser-singing.js?v=' dist/index.html
          grep -q 'matxa-worker.js?v=' dist/browser-singing.js
          grep -q 'world.wasm?v=' dist/matxa-worker.js
          test -s dist/vendor/world/world.wasm
